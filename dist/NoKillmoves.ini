; NoKillmoves - settings
; Also editable in game: Mod Control Panel (SKSE Menu Framework) > NoKillmoves.
; The in-game menu rewrites this file whenever you change a setting.
; true = switched off.

[General]
; Your kill moves while in third person. Sneak kills (throat slit) always stay on.
bDisablePlayerThirdPerson = true
; Your kill moves while in first person. Sneak kills (throat slit) always stay on.
bDisablePlayerFirstPerson = true
; Kill moves by NPCs, creatures and dragons - on you and on each other.
bDisableNPC = true
; The slow-motion kill cam when your spell kills the last enemy.
bDisableMagicKillCam = true
; The slow-motion kill cam that follows your arrow or bolt.
bDisableBowKillCam = false
